<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="450" height="250" viewBox="0 0 450 250" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>DCI Logo</title>
  <g transform="translate(20, 20)">
    <!-- Main DCI Monogram -->
    <g fill="#BF3030" font-family="Arial, sans-serif" font-weight="bold" font-size="180" letter-spacing="-10">
      <text x="0" y="150">D</text>
      <text x="140" y="150">C</text>
      <text x="325" y="150" letter-spacing="0">I</text>
    </g>
    
    <!-- Tagline text -->
    <g fill="#1A4C7C" font-family="Arial, sans-serif" font-weight="normal" font-size="28" letter-spacing="1">
      <text x="20" y="200">YOUR IT PARTNER</text>
    </g>
  </g>
</svg>