<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Strategy Hub Group -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="5s" repeatCount="indefinite" />
    
    <!-- Professional Calendar -->
    <rect x="34" y="38" width="60" height="60" rx="8" stroke="#2A4A7B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 54H94" stroke="#2A4A7B" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 30V42" stroke="#2A4A7B" stroke-width="3" stroke-linecap="round"/>
    <path d="M80 30V42" stroke="#2A4A7B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Abstract Calendar Grid (SaaS Style) -->
    <rect x="46" y="66" width="8" height="8" rx="2" stroke="#2A4A7B" stroke-width="2" opacity="0.4"/>
    <rect x="60" y="66" width="8" height="8" rx="2" stroke="#2A4A7B" stroke-width="2" opacity="0.4"/>
    <rect x="74" y="66" width="8" height="8" rx="2" stroke="#2A4A7B" stroke-width="2" opacity="0.4"/>
    <rect x="46" y="78" width="8" height="8" rx="2" stroke="#2A4A7B" stroke-width="2" opacity="0.4"/>
    <rect x="60" y="78" width="8" height="8" rx="2" stroke="#ac2a29" stroke-width="2">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Animated Clock (Expertise/Timing) -->
  <g transform="translate(102, 38)">
    <circle cx="0" cy="0" r="16" stroke="#2A4A7B" stroke-width="3" fill="white"/>
    <path d="M0 0V-8" stroke="#2A4A7B" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M0 0L6 4" stroke="#ac2a29" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="60s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Modern Chat Bubble (Consultation) -->
  <g>
    <path d="M18 76H38C40.2091 76 42 77.7909 42 80V94C42 96.2091 40.2091 98 38 98H28L20 106V98H18C15.7909 98 14 96.2091 14 94V80C14 77.7909 15.7909 76 18 76Z" stroke="#ac2a29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="white">
      <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M22 84H34" stroke="#ac2a29" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M22 90H30" stroke="#ac2a29" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Precision Click Indicator (Strategy) -->
  <g transform="translate(64, 82)">
    <path d="M0 0L12 6L6 7L10 14L7 16L3 9L-2 13V0Z" stroke="#2A4A7B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="white">
      <animateTransform attributeName="transform" type="scale" values="1; 1.15; 1" dur="1.5s" repeatCount="indefinite" />
    </path>
    <!-- Ripple Effect -->
    <circle cx="0" cy="0" r="2" stroke="#ac2a29" stroke-width="2" opacity="0">
      <animate attributeName="r" values="0; 20" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>