<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shadow for depth -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes boxPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    .cart-frame { 
      fill: none; 
      stroke: #2A4A7B; 
      stroke-width: 10; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }
    .implementation-box { 
      fill: #ac2a29; 
      animation: boxPulse 2s infinite ease-in-out; 
      transform-origin: 105px 85px;
      filter: url(#boxShadow);
    }
    .wheel-outer { 
      fill: #333; 
      animation: wheelSpin 3s linear infinite; 
      transform-origin: center;
    }
    .wheel-group-1 { transform-origin: 75px 165px; animation: wheelSpin 2s linear infinite; }
    .wheel-group-2 { transform-origin: 145px 165px; animation: wheelSpin 2s linear infinite; }
  </style>

  <!-- Cart Handle and Back -->
  <path class="cart-frame" d="M30 40 H50 L65 140 H160" />
  
  <!-- Cart Main Basket -->
  <path class="cart-frame" d="M60 70 H175 L160 140" />

  <!-- The "Implementation" Box (Primary Red) -->
  <g class="implementation-box">
    <rect x="75" y="60" width="70" height="55" rx="4" />
    <!-- Symbolic "S" or Package Tape -->
    <path d="M110 60 V115 M75 87 H145" stroke="white" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Ground Line (Adds stability) -->
  <line x1="40" y1="185" x2="180" y2="185" stroke="#ddd" stroke-width="2" stroke-linecap="round" />

  <!-- Animated Wheels -->
  <g class="wheel-group-1">
    <circle cx="75" cy="165" r="15" fill="#2A4A7B" />
    <circle cx="75" cy="165" r="11" fill="none" stroke="white" stroke-width="3" stroke-dasharray="15,10" />
    <circle cx="75" cy="165" r="4" fill="white" />
  </g>

  <g class="wheel-group-2">
    <circle cx="145" cy="165" r="15" fill="#2A4A7B" />
    <circle cx="145" cy="165" r="11" fill="none" stroke="white" stroke-width="3" stroke-dasharray="15,10" />
    <circle cx="145" cy="165" r="4" fill="white" />
  </g>
</svg>